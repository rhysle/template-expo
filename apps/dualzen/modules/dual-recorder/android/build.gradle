plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply from: '../nitrogen/generated/android/DualRecorder+autolinking.gradle'
group = 'expo.modules.dualrecorder'
version = '1.0.0'
def recorderArchitectures = rootProject.findProperty('reactNativeArchitectures')?.split(',') ?: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
android {
  namespace 'expo.modules.dualrecorder'
  buildFeatures { prefab true }
  defaultConfig {
    ndk { abiFilters(*recorderArchitectures) }
    versionCode 1
    versionName '1.0.0'
    externalNativeBuild { cmake { cppFlags '-std=c++20 -frtti -fexceptions'; arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
  }
  externalNativeBuild { cmake { path 'CMakeLists.txt' } }
  packagingOptions { jniLibs { excludes += ['**/libc++_shared.so', '**/libNitroModules.so', '**/libVisionCamera.so'] } }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.facebook.fbjni:fbjni:0.7.0'
  implementation project(':react-native-vision-camera')
  implementation project(':react-native-nitro-modules')
  implementation 'androidx.camera:camera-core:1.7.0-alpha03'
}
